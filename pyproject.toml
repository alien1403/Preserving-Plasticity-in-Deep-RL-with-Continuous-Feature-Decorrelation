[project]
name = "loss-of-plasticity-in-rl"
version = "0.1.0"
description = "Diagnostic toolkit and mitigation algorithms for Loss of Plasticity in Deep RL"
readme = "README.md"
authors = [
    { name = "alien1403", email = "hanghicelrazvanmihai@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "gymnasium>=1.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
    "tensorboard>=2.21.0",
    "torch>=2.14.0",
    "tqdm>=4.70.1",
    "wandb>=0.30.0",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
